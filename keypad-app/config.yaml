---
name: Keypad Mgmt
version: dev
slug: keypad-app
description: Keypad management app — store and validate user PIN codes via MQTT and fire Home Assistant events
url: https://github.com/cjramseyer/keypad-app
init: false
arch:
  - aarch64
  - amd64
  - armv7
  - i386
  - armhf
startup: services
ingress: true
ingress_port: 8000
panel_icon: mdi:dialpad
panel_title: Keypad Manager
ports:
  8000/tcp: 8000
services:
  - mqtt:want
options:
  log_level: info
  mqtt_topic_prefix: keypad
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  ha_event_topic: homeassistant/event/keypad_entry
  api_key: ""
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  mqtt_topic_prefix: str
  mqtt_host: str
  mqtt_port: int
  mqtt_user: str
  mqtt_password: password
  ha_event_topic: str
  api_key: password
