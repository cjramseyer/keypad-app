name: Problem / Error
description: Report an error, crash, or unexpected behavior that isn't a clear code bug.
title: "[Problem]: "
labels: ["problem", "triage"]
assignees:
  - cjramseyer
body:
  - type: markdown
    attributes:
      value: |
        Use this template for problems like the add-on failing to start, MQTT connection errors, or the web dashboard being unreachable.

  - type: textarea
    id: problem
    attributes:
      label: Describe the problem
      description: What is going wrong? What were you trying to do?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area affected
      options:
        - Add-on startup / shutdown
        - MQTT connection
        - Keypad code validation
        - Web dashboard
        - User management (add / remove / update)
        - Entry history
        - REST API
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Add-on logs
      description: Paste the full relevant log output here (Settings → Add-ons → Keypad Manager → Log tab).
      render: text
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Add-on configuration (redact passwords)
      description: Paste your add-on configuration YAML here.
      render: yaml

  - type: input
    id: addon_version
    attributes:
      label: Add-on version
      placeholder: e.g. 1.2.0
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: e.g. 2026.8.0
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - amd64
        - aarch64
        - armv7
        - armhf
        - i386
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
