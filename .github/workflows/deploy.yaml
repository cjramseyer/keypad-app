---
name: Deploy

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published

permissions:
  packages: write

jobs:
  build-and-push:
    name: Build and Push ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@692973e3563c81f960007d11e0e52006603cb4d2 # v4.1.2

      - name: Extract version from release tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@68827325e0b33d9d00c299c645eac5122ab3f723 # v3.0.0
      - uses: docker/setup-buildx-action@0d58f99b20bb23c9fdae6834460cd8a9a6281523 # v3.0.0

      - uses: docker/login-action@0885ff36abfbf1d6b1dd21e80251445a3173d7d0 # v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@4f4fda5e0e66f5a1f7e1b1c5d0d8c7e6f5e4d3c2 # v6.0.0
        with:
          context: keypad-app
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/keypad-app/${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/keypad-app/${{ matrix.arch }}:latest
