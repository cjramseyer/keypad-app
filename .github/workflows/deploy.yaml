---
name: Deploy

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push ${{ matrix.arch }}
    runs-on: ubuntu-latest
    env:
      IMAGE_BASE: >-
        ghcr.io/${{ github.repository_owner }}/keypad-app/${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@9bb56186c3b09b4f86b1c65136769dd318469633
        # v4.1.2

      - name: Extract version from release tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@68827325e0b33c7199eb31dd4e31fbe9023e06e3
        # v3.0.0
      - uses: >-
          docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226
        # v3.0.0

      - uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d
        # v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c382f710d39a5bb4e430307530a720f50c2d3318
        # v6.0.0
        with:
          context: keypad-app
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ env.IMAGE_BASE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_BASE }}:latest
