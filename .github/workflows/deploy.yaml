---
name: Deploy

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from release tag
        id: version
        # strips the leading 'v' from the tag (v1.0.0 → 1.0.0)
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Patch config.yaml version for the image build
        run: |
          sed -i "s/version: dev/version: \"${{ steps.version.outputs.version }}\"/" \
            keypad-app/config.yaml

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: keypad-app
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/keypad-app/${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/keypad-app/${{ matrix.arch }}:latest
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_DATE=${{ github.event.release.created_at }}
            BUILD_DESCRIPTION=Keypad management add-on for Home Assistant
            BUILD_NAME=Keypad Mgmt
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=${{ steps.version.outputs.version }}

  update-repo:
    name: Update config.yaml version on main
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version and commit
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/version: dev/version: \"${VERSION}\"/" keypad-app/config.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keypad-app/config.yaml
          git commit -m "chore: release ${GITHUB_REF_NAME} [skip ci]"
          git push
